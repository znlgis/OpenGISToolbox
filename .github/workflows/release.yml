name: Release

# Builds self-contained, no-install packages for Windows, Linux and macOS and
# attaches them to a GitHub Release. Triggered by pushing a version tag (v1.1.0).
# Each OS builds on its native runner so the bundled MaxRev GDAL native libraries
# match the target platform.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (${{ matrix.rid }})
        run: >
          dotnet publish src/OpenGISToolbox/OpenGISToolbox.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=false
          -o output/${{ matrix.rid }}

      - name: Package (${{ matrix.rid }})
        run: |
          $ver = "${{ github.ref_name }}"
          Compress-Archive -Path "output/${{ matrix.rid }}/*" `
            -DestinationPath "OpenGISToolbox-$ver-${{ matrix.rid }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.rid }}
          path: OpenGISToolbox-${{ github.ref_name }}-${{ matrix.rid }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
